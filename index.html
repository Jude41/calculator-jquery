<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <div class="calculator">
        <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear">C</button>
        <button class="del">DEL</button>
        <button class="operator modulo">%</button>
        <button class="operator divide">÷</button>
        <button class="value seven">7</button>
        <button class="value eight">8</button>
        <button class="value nine">9</button>
        <button class="operator plus">+</button>
        <button class="value four">4</button>
        <button class="value five">5</button>
        <button class="value six">6</button>
        <button class="operator minus">-</button>
        <button class="value one ">1</button>
        <button class="value two">2</button>
        <button class="value three">3</button>
        <button class="operator times">x</button>
        <button class="value zero">0</button>
        <button class="equals">=</button>
        <button class="value dot">.</button>

    </div>

    
    </div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="index.js"></script>
</body>
</html>
